name: Render Video

on:
  workflow_dispatch:
    inputs:
      naskah:
        description: "Path naskah JSON (relatif ke repo)"
        required: true
        default: "termux-render/zanzibar.json"
      quality:
        description: "Kualitas encode (crf: lebih kecil = lebih bagus)"
        required: false
        default: "18"
  push:
    paths:
      - "termux-render/**/*.json"
      - "termux-render/render.js"
      - "termux-render/visuals.js"
      - "termux-render/typography.js"
      - ".github/workflows/render-video.yml"

jobs:
  render:
    name: Render 2D Video
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system deps (canvas + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libpango1.0-dev \
            libjpeg-dev \
            libgif-dev \
            librsvg2-dev \
            libpixman-1-dev \
            pkg-config \
            ffmpeg

      - name: Install npm packages
        working-directory: termux-render
        run: npm install

      - name: Resolve naskah path
        id: naskah
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NASKAH="${{ inputs.naskah }}"
          else
            NASKAH="termux-render/zanzibar.json"
          fi
          if [ ! -f "$NASKAH" ]; then
            echo "File tidak ditemukan: $NASKAH"
            exit 1
          fi
          echo "path=$NASKAH" >> $GITHUB_OUTPUT
          echo "Memakai naskah: $NASKAH"

      - name: Render frames + MP4
        working-directory: termux-render
        env:
          RENDER_CRF: ${{ inputs.quality || '18' }}
        run: |
          # path naskah relatif dari termux-render/
          REL="${{ steps.naskah.outputs.path }}"
          REL="${REL#termux-render/}"
          node render.js "$REL"

      - name: List output
        run: |
          ls -lah termux-render/output/ || true
          du -sh termux-render/output/* 2>/dev/null || true

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-render
          path: termux-render/output/*.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        run: |
          echo "## Render selesai" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Naskah: \"${{ steps.naskah.outputs.path }}\"" >> $GITHUB_STEP_SUMMARY
          echo "- Unduh MP4 di tab **Artifacts** (video-render)" >> $GITHUB_STEP_SUMMARY
