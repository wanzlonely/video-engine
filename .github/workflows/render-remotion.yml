name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id (Floresiensis atau Virga)"
        required: true
        default: "Floresiensis"
      quality:
        description: "CRF (lebih kecil = lebih bagus)"
        required: false
        default: "18"

jobs:
  render:
    name: Remotion Render
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: remotion
        run: npm install
      - name: Render video
        working-directory: remotion
        run: |
          mkdir -p out
          COMP="${{ inputs.composition }}"
          npx remotion render src/index.ts "$COMP" "out/${COMP}.mp4" \
            --codec=h264 \
            --crf=${{ inputs.quality }}
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: remotion/out/*.mp4
          if-no-files-found: error
          retention-days: 14
