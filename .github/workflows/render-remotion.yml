name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id"
        required: true
        default: "Zanzibar"
      quality:
        description: "CRF"
        required: false
        default: "18"
  push:
    paths:
      - "remotion/**"
      - ".github/workflows/render-remotion.yml"

jobs:
  render:
    name: Remotion Render
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: remotion
        run: npm install
      - working-directory: remotion
        run: |
          mkdir -p out
          npx remotion render src/index.ts ${{ inputs.composition || 'Zanzibar' }} out/zanzibar.mp4 --codec=h264 --crf=${{ inputs.quality || '18' }}
      - uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: remotion/out/*.mp4
          if-no-files-found: error
          retention-days: 14
